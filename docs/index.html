<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ebdf">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Martini Society">
<title>Martini Society</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23151214'/><text x='32' y='45' font-family='Arial,sans-serif' font-weight='800' font-size='36' fill='%23f4e4e7' text-anchor='middle'>M</text></svg>">
<style>
/* ---------- fonts (inclusi nella cartella fonts/, licenza OFL) ---------- */
@font-face{font-family:'Bodoni Moda';font-weight:200 900;font-display:swap;src:url(fonts/bodoni-moda-latin-standard-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bodoni Moda';font-weight:200 900;font-display:swap;src:url(fonts/bodoni-moda-latin-ext-standard-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}

:root{
  --bg:#faf7f4; --paper:#fff; --ink:#151214; --ink2:#4a4246; --mute:#8f8489; --line:#ebe3df; --line2:#f3eeeb;
  --blush:#f5e6e9; --rose:#d88ea4; --accent:#a3164a; --champ:#b5935f; --violet:#6d6386;
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --ui:'Manrope',-apple-system,'Segoe UI',system-ui,sans-serif;
  
  --r:20px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(60vw 40vw at 85% -10%,rgba(216,142,164,.16),transparent 60%),radial-gradient(50vw 40vw at -10% 30%,rgba(181,147,95,.08),transparent 60%)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--blush)}

/* ---------- hero: collage di ritagli ---------- */
.hero{position:relative;height:clamp(420px,44vw,600px);overflow:hidden;background:#fff}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);width:min(50vw,660px);margin:0;z-index:5;line-height:0;filter:drop-shadow(0 6px 14px rgba(163,22,74,.18))}
.logo svg{width:100%;height:auto;overflow:visible;display:block}
.logo .l1{font-family:var(--display);font-weight:600;font-size:196px;letter-spacing:-4px}
.logo .l2{font-family:var(--ui);font-weight:600;font-size:40px;letter-spacing:30px}
.st{position:absolute;z-index:2;animation:pop .8s var(--ease) both}
.st svg,.st img{display:block;width:100%;height:auto;overflow:visible}
.st img{display:none;filter:drop-shadow(3px 9px 10px rgba(42,29,34,.22))}
.st img.ok{display:block}.st img.ok+svg{display:none}
@keyframes pop{from{opacity:0;translate:0 10px}}
.st-cosmo{left:4%;top:4%;width:14%;rotate:-6deg;animation-delay:.1s}
.st-city{right:4%;top:3%;width:13%;animation-delay:.05s}
.st-kiss{left:6%;bottom:8%;width:17%;rotate:-8deg;animation-delay:.2s}
.st-legs{right:21%;bottom:-2%;width:12%;rotate:6deg;animation-delay:.25s}
.st-gift{left:25%;top:6%;width:10%;rotate:4deg;animation-delay:.3s}
.st-taxi{right:-2%;bottom:3%;width:22%;animation-delay:.15s}
.me{position:absolute;top:16px;right:18px;z-index:3}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.me .av{width:26px;height:26px;font-size:13px}
.me select{appearance:none;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-radius:999px;padding:6px 28px 6px 12px;font-weight:500;cursor:pointer;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238f8489' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-size:14px;background-position:right 9px center}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:20;background:rgba(250,247,244,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
nav .in{max-width:1180px;margin:0 auto;display:flex;justify-content:center;gap:clamp(8px,3vw,44px)}
nav button{position:relative;border:0;background:none;padding:16px 4px;cursor:pointer;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:8px;transition:color .25s}
nav button svg{display:none}
nav button:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--ink);transform:scaleX(0);transition:transform .35s var(--ease)}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink)}
nav button.on:after{transform:scaleX(1)}

main{max-width:1180px;margin:0 auto;padding:48px 28px 110px}
.head{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.kick{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:10px}
.kick:before{content:"";width:22px;height:1px;background:currentColor}
.head h2{font-family:var(--display);font-weight:600;font-size:clamp(34px,4.6vw,54px);line-height:1;letter-spacing:-.04em;margin:0}
.head p{margin:10px 0 0;color:var(--mute);max-width:46ch}
h3{font-family:var(--display);font-weight:600;letter-spacing:-.025em;margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer;text-decoration:none;font-size:13.5px;font-weight:600;transition:all .25s var(--ease);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2c2629}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.icon{padding:9px;width:38px;height:38px}
.btn.danger{color:#9b1d3c}
.btn.danger:hover{border-color:#9b1d3c}
.btn[disabled]{opacity:.4;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- generic ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.muted{color:var(--mute)}
.small{font-size:13px}
.empty{text-align:center;padding:70px 20px;color:var(--mute)}
.empty b{display:block;font-family:var(--display);font-weight:600;font-size:30px;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-size:13px;color:#fff;border:2px solid var(--paper);flex:none;font-weight:700}
.avs{display:inline-flex}
.avs .av+.av{margin-left:-8px}
.reveal{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:1fr 340px;gap:36px;align-items:start}
@media (max-width:980px){.cal-wrap{grid-template-columns:1fr}}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-top h3{font-size:30px;font-weight:600;letter-spacing:-.02em}
.cal-top h3 span{color:var(--mute);font-family:var(--ui);font-size:14px;font-weight:500;letter-spacing:.1em;margin-left:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--paper);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.dow{text-align:left;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);padding:12px 12px 8px;font-weight:600;border-bottom:1px solid var(--line)}
.day{min-height:112px;padding:10px;cursor:pointer;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .2s}
.day:nth-child(7n){border-right:0}
.day:hover{background:#fdf9f8}
.day.out .n{color:#cfc5c1}
.day .n{font-family:var(--display);font-size:17px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;margin:-4px 0 2px -4px;font-variant-numeric:lining-nums}
.day.today .n{background:var(--ink);color:#fff}
.day.wk{background:#fdfbfa}
.ev{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.3;font-weight:500;padding:3px 6px;border-radius:7px;cursor:pointer;min-width:0}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:hover{background:var(--line2)}
.ev time{color:var(--mute);font-weight:500;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.agenda h3{font-size:24px;font-weight:600;margin-bottom:6px}
.ag{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line2);cursor:pointer}
.ag:hover .ag-t{color:var(--accent)}
.ag-d{text-align:center}
.ag-d b{display:block;font-family:var(--display);font-size:34px;font-weight:500;line-height:1;letter-spacing:-.03em}
.ag-d small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
.ag-t{font-weight:600;font-size:15px;margin:3px 0 2px;transition:color .2s}
@media (max-width:640px){
  .day{min-height:64px;padding:6px 4px;align-items:center}
  .day .n{font-size:15px;margin:0}
  .ev{padding:0;gap:0;justify-content:center}.ev span,.ev time{display:none}
  .evs{display:flex;gap:3px;justify-content:center}
  .dow{text-align:center;padding:10px 0 6px;font-size:9.5px;letter-spacing:.1em}
}

/* ---------- places ---------- */
.charts{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--paper);margin-bottom:34px;overflow:hidden}
@media (max-width:980px){.charts{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.charts{grid-template-columns:repeat(2,1fr)}}
.chart{padding:20px 18px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.chart .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--champ);font-weight:700}
.chart .nm{font-family:var(--display);font-size:21px;line-height:1.15;margin:8px 0 6px;letter-spacing:-.015em}
.chart .v{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.select{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 32px 9px 15px;font-size:13px;font-weight:500;cursor:pointer;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238f8489' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-size:14px;background-position:right 11px center}
.place{cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s;position:relative;display:flex;flex-direction:column}
.place:hover{transform:translateY(-3px);box-shadow:0 24px 50px -28px rgba(21,18,20,.28);border-color:#e0d6d1}
.place-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.place h3{font-size:27px;font-weight:600;line-height:1.1;margin-top:8px;letter-spacing:-.025em}
.score{font-family:var(--display);font-size:46px;line-height:.9;letter-spacing:-.05em;font-weight:500;text-align:right}
.score small{display:block;font-family:var(--ui);font-size:10px;letter-spacing:.18em;color:var(--mute);font-weight:600;margin-top:6px}
.meter{display:grid;grid-template-columns:86px 1fr 28px;align-items:center;gap:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink2);padding:5px 0}
.meter b{font-weight:600;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:12px}
.bar{height:2px;background:var(--line2);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);border-radius:2px;transform-origin:left;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.place-f{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line2);margin-top:16px}

/* rating input: segmented 1–5 */
.rate-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.rate-row .l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.rate-row .l small{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--mute);font-size:12px}
.seg5{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg5 input{display:none}
.seg5 label{width:36px;height:32px;display:grid;place-items:center;border-radius:999px;cursor:pointer;font-family:var(--display);font-size:16px;color:var(--mute);transition:all .2s;margin:0;text-transform:none;letter-spacing:0}
.seg5 label:hover{color:var(--ink);background:var(--line2)}
.seg5 input:checked+label{background:var(--ink);color:#fff}
.votes{margin-top:22px}
.votes table{width:100%;border-collapse:collapse;font-size:13px}
.votes th{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
.votes td{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
.votes td:first-child,.votes th:first-child{text-align:left}
.votes .q{color:var(--ink2);text-align:left;font-size:14px;padding-top:0}

/* ---------- wishlist ---------- */
.wish h3{font-size:26px;font-weight:600;margin:10px 0 4px;letter-spacing:-.025em}
.wish p{margin:12px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.5}
.wish .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
.heart.on{color:var(--accent);border-color:var(--accent)}
.heart.on svg{fill:var(--accent)}

/* ---------- polls ---------- */
.polls{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
@media (max-width:760px){.polls{grid-template-columns:1fr}}
.poll-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.poll h3{font-size:20px;line-height:1.2;margin:8px 0 4px}
.pill-closed{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;background:var(--line2);color:var(--mute);padding:5px 10px;border-radius:999px}
.opts{display:grid;gap:8px}
.opt{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 14px;cursor:pointer;font-weight:600;font-size:14.5px;transition:border-color .2s}
.opt:hover{border-color:var(--ink)}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blush);transition:width .6s var(--ease);z-index:0}
.opt>span:not(.fill){position:relative;z-index:1;display:flex;align-items:center;gap:8px}
.opt.sel{border-color:var(--accent)}
.opt.sel .fill{background:#f6d3de}
.opt.win{border-color:var(--accent);box-shadow:0 0 0 2px rgba(163,22,74,.12)}
.opt b{font-variant-numeric:tabular-nums;min-width:14px;text-align:right}
.opt .av{width:22px;height:22px;font-size:10px}
.opt[disabled]{cursor:default}
.poll.closed .opt:not(.win){opacity:.65}
.poll-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.optin{margin-top:8px!important}
form label.chk{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500;margin-top:18px}
form label.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- calls & group ---------- */
.callbox{margin-top:18px;padding:16px;border:1px dashed var(--line);border-radius:16px;background:var(--paper);display:grid;gap:8px;justify-items:start}
.btn.big{padding:14px 28px;font-size:15px}
.card.group{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.card.group h3{font-size:24px;margin:6px 0 2px}

/* ---------- friends ---------- */
.friend{text-align:center;padding:34px 22px 24px}
.friend .big{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;font-family:var(--display);font-size:40px;font-weight:700;color:#fff;position:relative}
.friend .big:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--line)}
.friend h3{font-size:30px;font-weight:600;letter-spacing:-.025em}
.friend .motto{color:var(--mute);margin:4px 0 0;font-size:15px}
.stats{display:flex;justify-content:center;margin:20px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.stats div{flex:1;padding:12px 4px}
.stats div+div{border-left:1px solid var(--line2)}
.stats b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.stats small{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(21,18,20,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);border-radius:26px;padding:34px;max-width:580px;width:100%;box-shadow:0 40px 100px -30px rgba(0,0,0,.45);position:relative;animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(18px);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.05;letter-spacing:-.03em;margin:10px 0 18px}
.x{position:absolute;top:16px;right:16px;border:0;background:var(--line2);width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--ink2);display:grid;place-items:center}
.x:hover{background:var(--line)}
@media (max-width:640px){
  .modal{padding:0;align-items:flex-end}

form label{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:18px 0 0}
form input:not([type=radio]),form select,form textarea{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400;transition:border-color .2s,box-shadow .2s}
form textarea{min-height:100px;resize:vertical}
form input:focus,form select:focus,form textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px rgba(21,18,20,.06)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg input{display:none}
.seg label{margin:0}
.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type-pick span{width:100%;justify-content:center;padding:12px}
.seg span{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500;transition:all .2s}
.seg span:hover{border-color:var(--ink)}
.seg input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.swatch span{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatch input:checked+span{box-shadow:0 0 0 2px var(--ink);border-color:var(--bg)}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:26px}
.for-call{display:none}
form.is-call .for-call{display:block}
form.is-call .for-place{display:none}
.facts{display:grid;gap:12px;margin:4px 0 24px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.fact svg{margin-top:2px;color:var(--mute)}
.hint{font-size:13px;color:var(--ink2);background:var(--blush);border-radius:14px;padding:12px 14px;margin-top:14px}
.subh{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:24px 0 10px}

.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:500;transition:transform .4s var(--ease);z-index:60;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
footer{text-align:center;padding:0 20px 40px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.03em;color:var(--accent)}

<script>

};

/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DOW=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const fmtDate=s=>s?parseISO(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}):'';
const fmtShort=s=>s?parseISO(s).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'}):'';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const safeUrl=u=>/^(https?:|facetime:|facetime-audio:|whatsapp:)/i.test(u||'')?u:'#';
const digits=p=>String(p||'').replace(/\D/g,'');
const waNum=p=>{let d=digits(p);if(d.startsWith('00'))d=d.slice(2);if(d.length===10&&d.startsWith('3'))d='39'+d;return d};
const telNum=p=>{const s=String(p||'').trim();return s.startsWith('+')?'+'+digits(s):'+'+waNum(s)};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400)}

/* ================= state ================= */
let S={friends:[],events:[],places:[],wishlist:[],columns:[],polls:[],pollvotes:[],settings:[]};
let me=ls.get('ms_me');
let tab=ls.get('ms_tab')||'cal';if(!['cal','polls','places','wish','friends'].includes(tab))tab='cal';
let cur=new Date();cur.setDate(1);
let placeSort='tot',placeFilter='';
let lastTab=null;

const friend=id=>S.friends.find(f=>f.id===id);
const grp=()=>({name:'Uscite Romane',instagram:'',whatsapp:'',...(S.settings.find(x=>x.id==='group')||{})});
const PLAT={instagram:'Instagram',whatsapp:'WhatsApp',facetime:'FaceTime'};
const callUrl=e=>e.link||(e.platform==='instagram'?grp().instagram:e.platform==='whatsapp'?grp().whatsapp:'')||'';
const fname=id=>friend(id)?.name||'Qualcuna';
const avatar=id=>{const f=friend(id);return f?`<span class="av" style="background:${esc(f.color)}" title="${esc(f.name)}">${esc((f.name||'?')[0].toUpperCase())}</span>`:''};

/* ---- storage: server locale (python) oppure Supabase (GitHub Pages) ---- */
const CFG=window.MARTINI_CONFIG||{};
const REMOTE=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
const EMPTY=()=>({friends:[],events:[],places:[],wishlist:[],columns:[],polls:[],pollvotes:[],settings:[]});
const newId=()=>(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/-/g,'').slice(0,12);
const sbBase=()=>CFG.supabaseUrl.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'')+'/rest/v1';
const sbHeaders=(extra={})=>({apikey:CFG.supabaseAnonKey,...(CFG.supabaseAnonKey.startsWith('sb_')?{}:{Authorization:'Bearer '+CFG.supabaseAnonKey}),'Content-Type':'application/json',...extra});
const KEY=()=>ls.get('ms_key')||'';
// tutte le chiamate passano da funzioni del database che controllano la parola d'ordine (niente header custom → niente problemi CORS)
async function rpc(fn,args){
  const r=await fetch(sbBase()+'/rpc/'+fn,{method:'POST',cache:'no-store',headers:sbHeaders(),body:JSON.stringify({k:KEY(),...args})});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}const e=new Error('HTTP '+r.status+' '+m);e.status=r.status;console.warn('Supabase',fn,r.status,m);throw e}
  return r.status===204?null:r.json().catch(()=>null);
}
async function checkKey(){return !!(await rpc('club_ok',{}))}
async function loadState(){
  if(!REMOTE){const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error(r.status);return {...EMPTY(),...(await r.json())}}
  const rows=await rpc('ms_list',{});
  const s=EMPTY();(rows||[]).forEach(x=>{if(s[x.col])s[x.col].push({...x.data,id:x.id})});return s;
}
async function send(method,col,body,id){
  if(!REMOTE){
    const r=await fetch(`/api/${col}${id?'/'+id:''}`,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error(r.status);return r.json().catch(()=>null);
  }
  if(method==='POST'){const obj={...body,id:newId(),createdAt:new Date().toISOString()};await rpc('ms_put',{p_id:obj.id,p_col:col,p_data:obj});return obj}
  if(method==='PUT'){await rpc('ms_put',{p_id:id,p_col:col,p_data:{...body,id}});return body}
  if(method==='DELETE'){await rpc('ms_del',{p_id:id});return{ok:true}}
}
async function refresh(){
  try{S=await loadState();render()}
  catch(e){if(e.status===401||e.status===403)return askKey(true);toast(REMOTE?'Database non raggiungibile':'Server non raggiungibile')}
}
async function api(method,col,body,id){
  try{const out=await send(method,col,body,id);await refresh();return out}
  catch(e){if(e.status===401||e.status===403){askKey(true);return null}toast('Non sono riuscita a salvare');return null}
}
const put=(col,obj)=>{const{id,...rest}=obj;return api('PUT',col,{...rest,id},id)};
function askKey(wrong){
  modal(`<div style="text-align:center;padding:10px 0">
    <div class="kick" style="justify-content:center">Martini Society</div>
    <h2 style="font-size:46px;margin-top:14px">Solo su invito</h2>
    <p class="muted" style="margin:-6px 0 0">${wrong?'Parola d’ordine sbagliata. Riprova.':'Scrivi la parola d’ordine del club per entrare.'}</p>
    <form id="kf"><input name="k" type="password" required autofocus placeholder="parola d’ordine" style="text-align:center;margin-top:24px">
    <div class="actions" style="justify-content:center"><button class="btn pri">Entra</button></div></form></div>`,true);
  $('#kf').onsubmit=async e=>{e.preventDefault();ls.set('ms_key',e.target.k.value.trim());
    try{if(await checkKey()){closeModal();toast('Benvenuta nel club');boot()}else askKey(true)}
    catch(err){toast('Database non raggiungibile')}};
}

/* ================= modal ================= */
function modal(html,lock){const m=$('#modal');$('#modalBody').innerHTML=html;m.classList.add('open');
  if(lock)m.dataset.lock='1';else delete m.dataset.lock;$('.x').style.display=lock?'none':'';document.body.style.overflow='hidden'}
function closeModal(){const m=$('#modal');m.classList.remove('open');delete m.dataset.lock;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').dataset.lock)closeModal()});

/* ================= render root ================= */
function render(){
  const f=friend(me);
  $('#meBox').innerHTML=`${f?avatar(me):''}<select id="meSel" aria-label="Chi sei?"><option value="">Chi sei?</option>${S.friends.map(x=>`<option value="${x.id}" ${x.id===me?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
  $('#meSel').onchange=e=>{me=e.target.value||null;ls.set('ms_me',me||'');render();if(me)toast(`Ciao ${fname(me)}`)};
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const v=$('#view');
  ({cal:renderCal,polls:renderPolls,places:renderPlaces,wish:renderWish,friends:renderFriends}[tab]||renderCal)(v);
  if(lastTab!==tab){v.classList.remove('reveal');void v.offsetWidth;v.classList.add('reveal');lastTab=tab}
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;ls.set('ms_tab',tab);render();
  if(window.innerWidth>760)window.scrollTo({top:$('nav').offsetTop,behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'})});
function needMe(){if(!me){toast('Prima scegli chi sei, in alto a destra');return true}return false}
const HEADICON={cal:'taxi',polls:'kiss',places:'cosmo',wish:'gift',friends:'legs'};
const MVB={"cosmo": "0 0 240 300", "kiss": "0 0 260 170", "legs": "0 0 300 480", "city": "0 0 260 400", "gift": "0 0 260 230", "taxi": "0 0 400 150"};
const mini=n=>{const vb=MVB[n];const[x,y,w,h]=vb.split(" ");return `<svg class="mini mini-${n}" viewBox="${vb}" aria-hidden="true"><use href="#s-${n}" x="${x}" y="${y}" width="${w}" height="${h}" filter="url(#stk)"/></svg>`};
const head=(k,t,p,actions='')=>`<div class="head"><h2>${HEADICON[tab]?mini(HEADICON[tab]):''}<span>${t}</span></h2>${actions}</div>`;

/* ================= AGENDA ================= */
const TYPES=[{k:'appuntamento',l:'Appuntamento',c:'var(--accent)'},{k:'chiamata',l:'Chiamata',c:'var(--violet)'}];
const TYPE=Object.fromEntries(TYPES.map(t=>[t.k,t]));TYPE.serata=TYPE.appuntamento;
const tdot=t=>`<i class="dot" style="background:${(TYPE[t]||TYPES[0]).c}"></i>`;

function renderCal(v){
  const y=cur.getFullYear(),m=cur.getMonth();
  const start=new Date(y,m,1);start.setDate(1-((start.getDay()+6)%7));
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(i>=35&&d.getMonth()!==m)break;
    const k=iso(d);
    const evs=S.events.filter(e=>e.date===k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    cells.push(`<div class="day ${d.getMonth()!==m?'out':''} ${k===today()?'today':''} ${i%7>4?'wk':''}" data-day="${k}">
      <span class="n">${d.getDate()}</span><div class="evs">
      ${evs.map(e=>`<div class="ev" data-ev="${e.id}">${tdot(e.type)}<span>${e.time?`<time>${esc(e.time)}</time> `:''}${esc(e.title)}</span></div>`).join('')}</div>
    </div>`);
  }
  const up=S.events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,6);
  v.innerHTML=head('01 — Agenda','Cosa facciamo stasera?','Serate, appuntamenti e chiamate tra di noi. Tocca un giorno per aggiungere un piano.',
    `<button class="btn pri" onclick="eventForm()">${I.calplus} Aggiungi al calendario</button>`)+`
  <div class="cal-wrap">
    <div>
      <div class="cal-top">
        <h3>${MONTHS[m]}<span>${y}</span></h3>
        <div class="btns"><button class="btn sm ghost" onclick="cur=new Date();cur.setDate(1);render()">Oggi</button>
        <button class="btn icon" onclick="cur.setMonth(cur.getMonth()-1);render()" aria-label="Mese precedente">${I.left}</button>
        <button class="btn icon" onclick="cur.setMonth(cur.getMonth()+1);render()" aria-label="Mese successivo">${I.right}</button></div>
      </div>
      <div class="cal">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div>
      <div class="legend">${TYPES.map(t=>`<span class="tag">${tdot(t.k)} ${t.l}</span>`).join('')}</div>
    </div>
    <aside class="agenda">
      <h3>In agenda</h3>
      ${up.length?up.map(e=>{const d=parseISO(e.date);return`<div class="ag" data-ev="${e.id}">
        <div class="ag-d"><b>${d.getDate()}</b><small>${MONTHS[d.getMonth()].slice(0,3)}</small></div>
        <div><span class="tag">${tdot(e.type)} ${(TYPE[e.type]||TYPES[0]).l}${e.time?' · '+esc(e.time):''}</span>
        <div class="ag-t">${esc(e.title)}</div>
        ${e.place&&e.type!=='chiamata'?`<div class="muted small">${esc(e.place)}</div>`:''}
        ${(e.going||[]).length?`<div class="avs" style="margin-top:8px">${e.going.map(avatar).join('')}</div>`:''}
        ${e.type==='chiamata'&&callUrl(e)?`<a class="btn sm acc" style="margin-top:10px" href="${esc(safeUrl(callUrl(e)))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${e.platform==='instagram'?I.ig:I.phone} Avvia</a>`:''}</div></div>`}).join('')
      :`<p class="muted" style="font-size:15px;border-top:1px solid var(--line2);padding-top:16px">Agenda vuota. Inaccettabile.</p>`}
    </aside>
  </div>`;
  v.querySelectorAll('[data-ev]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();eventDetail(el.dataset.ev)}));
  v.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>{
    const evs=S.events.filter(e=>e.date===el.dataset.day);
    if(window.innerWidth<=640&&evs.length)dayList(el.dataset.day);else eventForm({},el.dataset.day)}));

function downloadICS(id){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);
  const d=e.date.replace(/-/g,'');
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const when=e.time?`DTSTART:${d}T${e.time.replace(':','')}00\r\nDURATION:PT${e.type==='chiamata'?'1':'3'}H`:`DTSTART;VALUE=DATE:${d}`;
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Martini Society//IT','BEGIN:VEVENT',`UID:${e.id}@martini-society`,`DTSTAMP:${now}`,when,
    `SUMMARY:${icsEsc(e.title)}`,e.place?`LOCATION:${icsEsc(e.place)}`:'',
    `DESCRIPTION:${icsEsc([e.notes,e.link].filter(Boolean).join('\n'))}`,
    'BEGIN:VALARM','TRIGGER:-PT1H','ACTION:DISPLAY','DESCRIPTION:Tra un\'ora!','END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download=(e.title.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'evento')+'.ics';a.click();
}

const votesOf=pid=>S.pollvotes.filter(v=>v.poll===pid&&friend(v.friend));
function pollTally(p){
  const vs=votesOf(p.id);const t={};(p.options||[]).forEach(o=>t[o.id]=[]);
  vs.forEach(v=>(v.choice||[]).forEach(c=>{if(t[c])t[c].push(v.friend)}));
  const max=Math.max(0,...Object.values(t).map(a=>a.length));
  return{t,vs,max,winners:max?(p.options||[]).filter(o=>t[o.id].length===max):[]};
}
function renderPolls(v){
  const list=[...S.polls].sort((a,b)=>(a.closed?1:0)-(b.closed?1:0)||(a.date||'9').localeCompare(b.date||'9'));
  v.innerHTML=head('','Sondaggi','',`<button class="btn pri" onclick="pollForm()">${I.plus} Nuovo sondaggio</button>`)+
  (list.length?`<div class="polls">${list.map(pollCard).join('')}</div>`:`<div class="empty"><b>Nessun sondaggio.</b></div>`);
}
function pollCard(p){
  const{t,vs,max,winners}=pollTally(p);const mine=(me&&votesOf(p.id).find(v=>v.friend===me)?.choice)||[];
  const voted=new Set(vs.map(x=>x.friend));const missing=S.friends.filter(f=>!voted.has(f.id));
  return `<article class="card poll ${p.closed?'closed':''}">
    <div class="poll-h"><div>${p.date?`<span class="tag">${I.cal2} ${esc(cap(fmtDate(p.date)))}</span>`:''}<h3>${esc(p.q)}</h3>
      <div class="muted small">${p.multi?'Puoi scegliere più opzioni':'Una sola scelta'} · di ${esc(fname(p.createdBy))}</div></div>
      ${p.closed?`<span class="pill-closed">Chiuso</span>`:''}</div>
    <div class="opts">${(p.options||[]).map(o=>{const n=t[o.id].length;const pct=vs.length?Math.round(n/vs.length*100):0;const sel=mine.includes(o.id);const win=p.closed&&n&&n===max;
      return `<button class="opt ${sel?'sel':''} ${win?'win':''}" ${p.closed?'disabled':''} onclick="vote('${p.id}','${o.id}')">
        <span class="fill" style="width:${pct}%"></span>
        <span class="o-t">${sel?I.check:''}${esc(o.t)}</span>
        <span class="o-r"><span class="avs">${t[o.id].map(avatar).join('')}</span><b>${n}</b></span></button>`}).join('')}</div>
    <div class="poll-f">
      <span class="muted small">${vs.length}/${S.friends.length} hanno votato${missing.length&&!p.closed?` · mancano ${missing.map(f=>esc(f.name)).join(', ')}`:''}</span>
      <div class="btns">
        ${p.closed&&winners.length?`<button class="btn sm pri" onclick="pollToCal('${p.id}')">${I.calplus} Aggiungi al calendario</button>`:''}
        ${!p.closed?`<a class="btn sm icon" href="https://wa.me/?text=${encodeURIComponent(pollText(p))}" target="_blank" rel="noopener" title="Invia sul gruppo">${I.msg}</a>`:''}
        <button class="btn sm" onclick="togglePoll('${p.id}')">${p.closed?'Riapri':'Chiudi'}</button>
        <button class="btn sm icon ghost" onclick="delPoll('${p.id}')" title="Elimina">${I.trash}</button>
      </div></div>
  </article>`;
}
function pollText(p){return `🗳️ *${p.q}*${p.date?'\n📅 '+fmtDate(p.date):''}\n\n${(p.options||[]).map(o=>'• '+o.t).join('\n')}\n\nVota su Martini Society 💋`}
async function vote(pid,oid){
  if(needMe())return;const p=S.polls.find(x=>x.id===pid);if(!p||p.closed)return;

}
function replan(id){const p=S.places.find(x=>x.id===id);eventForm({title:'Si torna da '+p.name,place:p.name+(p.zone?', '+p.zone:'')})}
async function delPlace(id){if(!confirm('Eliminiamo questo locale e tutti i voti?'))return;await api('DELETE','places',null,id);closeModal()}

/* ================= DA PROVARE ================= */
function renderWish(v){
  const list=[...S.wishlist].sort((a,b)=>(b.want||[]).length-(a.want||[]).length);
  v.innerHTML=head('03 — Da provare','La lista dei desideri','I posti che vogliamo provare. Indecise? Lasciate scegliere alla ruota.',
    `<button class="btn pri" onclick="wishForm()">${I.plus} Aggiungi posto</button>`)+`
  ${list.length?`<div class="grid">${list.map(w=>{const want=w.want||[];const iW=me&&want.includes(me);return`
    <article class="card wish">
      <span class="tag">${esc(w.kind||'Posto')}${w.zone?' · '+esc(w.zone):''}</span>
      <h3>${esc(w.name)}</h3>
      ${w.note?`<p>${esc(w.note)}</p>`:''}
      ${w.link?`<a class="muted small" href="${esc(safeUrl(w.link))}" target="_blank" rel="noopener">${esc(w.link.replace(/^https?:\/\/(www\.)?/,'').slice(0,40))}</a>`:''}
      <div class="foot">
        <span class="small muted">di ${esc(fname(w.addedBy))}</span>
        <div class="btns">
          <button class="btn sm heart ${iW?'on':''}" onclick="toggleWant('${w.id}')" title="Ci voglio andare">${I.heart} ${want.length}</button>
          <button class="btn sm icon" onclick="planWish('${w.id}')" title="Pianifica">${I.calplus}</button>
          <button class="btn sm icon" onclick="doneWish('${w.id}')" title="Ci siamo state">${I.check}</button>
          <button class="btn sm icon ghost" onclick="delWish('${w.id}')" title="Elimina">${I.trash}</button>
        </div>
      </div>
    </article>`}).join('')}</div>`:`<div class="empty"><b>La lista è vuota.</b></div>`}`;
}
function wishForm(){
  if(needMe())return;
  modal(`<h2>Un posto nuovo</h2><form id="f">
    <label>Nome<input name="name" required></label>
    <div class="row"><label>Tipo<select name="kind">${KINDS.map(k=>`<option>${k}</option>`).join('')}</select></label><label>Zona<input name="zone"></label></div>
    <label>Link<input name="link" placeholder="Instagram, sito, recensione…"></label>
    <label>Perché ci dobbiamo andare<textarea name="note" placeholder="Me l’ha detto la collega, il dj del giovedì…"></textarea></label>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn pri">Aggiungi</button></div></form>`);
  $('#f').onsubmit=async e=>{e.preventDefault();await api('POST','wishlist',{...Object.fromEntries(new FormData(e.target)),addedBy:me,want:[me]});closeModal();toast('Aggiunto alla lista')};
}
async function toggleWant(id){if(needMe())return;const w=S.wishlist.find(x=>x.id===id);const s=new Set(w.want||[]);s.has(me)?s.delete(me):s.add(me);await put('wishlist',{...w,want:[...s]})}
function planWish(id){const w=S.wishlist.find(x=>x.id===id);eventForm({title:w.name,place:w.name+(w.zone?', '+w.zone:'')})}
async function doneWish(id){
  if(needMe())return;const w=S.wishlist.find(x=>x.id===id);
  const n=await api('POST','places',{name:w.name,kind:w.kind,zone:w.zone,link:w.link,visited:today(),ratings:{},addedBy:me});
  await api('DELETE','wishlist',null,id);
  if(n){tab='places';ls.set('ms_tab',tab);render();placeDetail(n.id);toast('Spostato nei locali, ora votate')}
}
async function delWish(id){if(!confirm('Togliamo questo posto dalla lista?'))return;await api('DELETE','wishlist',null,id)}

/* ================= AMICHE ================= */
const COLORS=['#a3164a','#d88ea4','#b5935f','#6d6386','#151214','#c97b5a','#5f8a80'];
function renderFriends(v){
  const g=grp();
  const groupCard=`<article class="card group"><div><span class="tag">${I.users} Il gruppo</span><h3>${esc(g.name)}</h3>
    <div class="muted small">${g.instagram?'Instagram collegato':'Instagram non collegato'} · ${g.whatsapp?'WhatsApp collegato':'WhatsApp non collegato'}</div></div>
    <div class="btns">${g.instagram?`<a class="btn sm icon" href="${esc(safeUrl(g.instagram))}" target="_blank" rel="noopener" title="Apri su Instagram">${I.ig}</a>`:''}<button class="btn sm" onclick="groupForm()">${I.edit} ${g.instagram||g.whatsapp?'Modifica':'Collega'}</button></div></article>`;
  v.innerHTML=head('05 — Le amiche','Le ragazze','Il numero di telefono serve per chiamarsi con un tocco su WhatsApp o FaceTime.',
    `<button class="btn pri" onclick="friendForm()">${I.plus} Aggiungi amica</button>`)+groupCard+
  (S.friends.length?`<div class="grid">${S.friends.map(f=>{
    const n=S.events.filter(e=>(e.going||[]).includes(f.id)).length;
    const r=S.places.filter(p=>p.ratings?.[f.id]).length;
    return`<article class="card friend">
      <div class="big" style="background:${esc(f.color)}">${esc((f.name||'?')[0].toUpperCase())}</div>
      <h3>${esc(f.name)}</h3>
      ${f.motto?`<p class="motto">“${esc(f.motto)}”</p>`:''}
      <div class="stats"><div><b>${n}</b><small>Serate</small></div><div><b>${r}</b><small>Voti</small></div></div>
      <div class="btns" style="justify-content:center">
        ${f.phone?`<a class="btn sm icon" href="https://wa.me/${esc(waNum(f.phone))}" target="_blank" rel="noopener" title="WhatsApp">${I.msg}</a><a class="btn sm icon" href="facetime://${esc(telNum(f.phone))}" title="FaceTime">${I.video}</a>`:''}
        <button class="btn sm" onclick="friendForm(S.friends.find(x=>x.id==='${f.id}'))">${I.edit} Modifica</button>
      </div></article>`}).join('')}</div>`
  :`<div class="empty"><b>Chi siete?</b></div>`);
}
function friendForm(f={}){
  const x={name:'',phone:'',color:COLORS[S.friends.length%COLORS.length],motto:'',...f};
  modal(`<h2>${f.id?esc(f.name):'Benvenuta'}</h2><form id="f">
    <label>Nome<input name="name" required value="${esc(x.name)}"></label>
    <label>Telefono · con prefisso<input name="phone" value="${esc(x.phone)}" type="tel" placeholder="+39 333 …"></label>
    <label>Motto<input name="motto" value="${esc(x.motto)}" placeholder="un drink, poi vediamo"></label>
    <label>Colore</label><div class="seg swatch">${COLORS.map(c=>`<label><input type="radio" name="color" value="${c}" ${x.color===c?'checked':''}><span style="background:${c}"></span></label>`).join('')}</div>
    <div class="actions" style="justify-content:space-between">${f.id?`<button type="button" class="btn sm ghost danger" onclick="delFriend('${f.id}')">${I.trash} Elimina</button>`:'<span></span>'}
    <div class="btns"><button type="button" class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn pri">Salva</button></div></div></form>`);
  $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    if(f.id)await put('friends',{...x,...d});
    else{const n=await api('POST','friends',d);if(n&&!me){me=n.id;ls.set('ms_me',me);render();toast(`Benvenuta ${n.name}`)}}
    closeModal()};
}
function groupForm(){
  const g=grp();
  modal(`<h2>Il gruppo</h2><form id="f">
    <label>Nome<input name="name" value="${esc(g.name)}"></label>
    <label>Link del gruppo Instagram<input name="instagram" value="${esc(g.instagram)}" placeholder="https://ig.me/j/…"></label>
    <div class="hint">In Instagram apri la chat del gruppo → tocca il nome in alto → <b>Invita tramite link</b> (o “Link d’invito”) → copia. Da computer va bene anche l’indirizzo della chat, tipo <i>instagram.com/direct/t/…</i></div>
    <label>Link del gruppo WhatsApp · facoltativo<input name="whatsapp" value="${esc(g.whatsapp)}" placeholder="https://chat.whatsapp.com/…"></label>
    <div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Annulla</button><button class="btn pri">${I.check} Salva</button></div></form>`);
  $('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    d.instagram=d.instagram.trim();d.whatsapp=d.whatsapp.trim();
    if(d.instagram&&!/^https?:\/\//.test(d.instagram))d.instagram='https://'+d.instagram;
    await api('PUT','settings',{...grp(),...d},'group');closeModal();toast('Gruppo salvato')};
}
async function delFriend(id){if(!confirm('Eliminare questo profilo?'))return;await api('DELETE','friends',null,id);if(me===id){me=null;ls.set('ms_me','')}closeModal()}

/* ================= boot ================= */
let booted=false;
async function boot(){
  await refresh();
  if(!S.friends.length){tab='friends';render()}
  if(!booted){booted=true;setInterval(()=>{if(!$('#modal').classList.contains('open'))refresh()},REMOTE?15000:10000)}
}
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  if(REMOTE){
    if(!ls.get('ms_key'))return askKey(false);
    try{if(!(await checkKey()))return askKey(true)}catch(e){toast('Database non raggiungibile')}
  }
  boot();
})();
</script>
</body>
</html>
